<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture Load Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="canvas-container">
      <canvas id="sim-canvas"></canvas>
      <div id="level-overlay" class="hidden">
        <div class="overlay-box">
          <h2 id="overlay-title"></h2>
          <p id="overlay-desc"></p>
          <div class="overlay-buttons">
            <button id="btn-retry">↺ Retry</button>
            <button id="btn-next">Next Level →</button>
            <button id="btn-free-mode">🛠️ Free Mode</button>
          </div>
        </div>
      </div>
    </div>
    <div id="toolbar">
      <!-- Column 1: Level selector + Palette + Help -->
      <div class="toolbar-col">
        <div class="toolbar-section" id="level-selector">
          <h3>🎮 Levels</h3>
          <select id="ctl-level">
            <option value="">-- Select level --</option>
          </select>
          <div class="level-buttons">
            <button id="btn-level-start">▶ Start</button>
            <button id="btn-level-free">🛠️ Free</button>
          </div>
        </div>

        <div class="toolbar-section" id="level-objective" style="display:none;">
          <h3>📋 <span id="lvl-title"></span></h3>
          <p id="lvl-desc"></p>
          <div class="lvl-progress-wrap">
            <div class="lvl-progress-bar"><div id="lvl-progress-fill"></div></div>
            <span class="lvl-progress-text" id="lvl-progress-text">0 / 0</span>
          </div>
          <p class="lvl-hint" id="lvl-hint"></p>
        </div>

        <div class="toolbar-section">
          <h3>Nodes</h3>
          <div id="palette"></div>
        </div>
        <button id="btn-generate">⚡ Generate Request</button>
        <div class="toolbar-section">
          <label class="ctl-label">Test users <span id="val-auto-rate">0 users</span></label>
          <input type="range" id="ctl-auto-rate" min="0" max="200" step="5" value="0">
        </div>
        <div class="toolbar-help">
          <p><strong>Place:</strong> select type → click canvas</p>
          <p><strong>Connect:</strong> click A → click B</p>
          <p><strong>Move:</strong> drag node</p>
          <p><strong>Delete:</strong> select → Del</p>
          <p><strong>Cancel:</strong> Esc</p>
        </div>
      </div>

      <!-- Column 2: Backend settings -->
      <div class="toolbar-col">
        <div class="toolbar-section">
          <h3>Backend</h3>

          <label class="ctl-label">Timeout <span id="val-timeout">5000ms</span></label>
          <input type="range" id="ctl-timeout" min="500" max="30000" step="500" value="5000">

          <label class="ctl-label">On timeout</label>
          <select id="ctl-on-timeout">
            <option value="abort">Abort children</option>
            <option value="detach">Let children finish</option>
          </select>

          <label class="ctl-check">
            <input type="checkbox" id="ctl-sequential" checked>
            Send DB requests one by one
          </label>

          <label class="ctl-label">DB requests <span id="val-db-n">1 – 5</span></label>
          <div class="range-pair">
            <input type="range" id="ctl-db-min" min="1" max="20" step="1" value="1">
            <input type="range" id="ctl-db-max" min="1" max="20" step="1" value="5">
          </div>

          <label class="ctl-label">Processing time <span id="val-db-time">300 – 1500ms</span></label>
          <div class="range-pair">
            <input type="range" id="ctl-time-min" min="0" max="1000" step="2" value="619">
            <input type="range" id="ctl-time-max" min="0" max="1000" step="2" value="794">
          </div>

          <label class="ctl-label">DB size impact <span id="val-db-coeff">1.0×</span></label>
          <input type="range" id="ctl-db-coeff" min="0" max="10" step="1" value="10">
          <div class="ctl-hint">Каждые 100 запросов добавляют <span id="val-db-coeff-ms">100</span>ms к времени обработки</div>

          <label class="ctl-label">Network latency <span id="val-net-latency">400ms</span></label>
          <input type="range" id="ctl-net-latency" min="50" max="2000" step="10" value="400">
          <div class="ctl-hint">Время пролёта частицы между узлами (чем меньше — тем быстрее симуляция)</div>
        </div>
      </div>

      <!-- Column 3: Stats -->
      <div class="toolbar-col">
        <div class="toolbar-section" id="stats">
          <h3>Statistics</h3>
          <div id="stats-content"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
